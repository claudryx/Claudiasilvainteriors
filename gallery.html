<!DOCTYPE html><html><head><meta name="viewport" content="width=device-width, initial-scale=1"><style>
:root{--bg:#f7f3ee;--text:#2e2925;--muted:#7a7068;--burgundy:#6b1f2b;}
body{margin:0;font-family:Georgia,"Times New Roman",serif;background:var(--bg);color:var(--text);}

nav{position:absolute;top:0;left:0;right:0;display:flex;justify-content:center;gap:16px;padding:26px;z-index:10;}
nav a{color:white;text-decoration:none;font-size:11px;letter-spacing:.18em;text-transform:uppercase;}
.nav-light a{color:var(--muted);}

.hero{height:100vh;background:linear-gradient(rgba(0,0,0,.2),rgba(0,0,0,.25)),url('hero.jpeg') center/cover no-repeat;display:flex;align-items:center;justify-content:center;text-align:center;color:white;}
.line1{display:block;font-weight:300;font-size:clamp(2.4rem,4.6vw,4rem);letter-spacing:.12em;}
.line2{display:block;font-weight:300;font-size:clamp(1.3rem,2.6vw,2rem);letter-spacing:.18em;margin-top:10px;}

.header{padding:100px 20px 20px;text-align:center;}
.header span{color:var(--burgundy);font-size:26px;letter-spacing:.12em;}

.section{max-width:1100px;margin:auto;padding:50px 30px;}

.about-title{text-align:center;margin-bottom:25px;color:var(--burgundy);font-size:12px;letter-spacing:.2em;text-transform:uppercase;}

.about p,.section-title,.project-title,.services p,.contact,footer{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);}

.about{max-width:700px;margin:auto;text-align:center;}
.about p{line-height:2.2;margin-bottom:20px;}

.project-title{text-align:center;margin-bottom:20px;}

.scroll-gallery{display:flex;overflow-x:auto;gap:20px;scroll-snap-type:x mandatory;-webkit-overflow-scrolling:touch;padding-bottom:10px;}
.scroll-gallery::-webkit-scrollbar{display:none;}
.scroll-img{height:420px;width:auto;flex-shrink:0;scroll-snap-align:start;border:none;outline:none;}

.services{max-width:700px;margin:auto;text-align:center;line-height:2.2;}

footer{text-align:center;padding:50px 20px;color:var(--burgundy);}
</style></head>

<div id="lightbox" style="display:none;position:fixed;inset:0;background:black;z-index:9999;align-items:center;justify-content:center;">
  <img id="lightbox-img" style="max-width:95vw;max-height:95vh;">
</div>

<script>
const images = document.querySelectorAll('.scroll-img');
const lightbox = document.getElementById('lightbox');
const lightboxImg = document.getElementById('lightbox-img');

let currentIndex = 0;
const imgList = Array.from(images);

function showImage(index){
  currentIndex = index;
  lightboxImg.src = imgList[currentIndex].src;
}

imgList.forEach((img, i) => {
  img.addEventListener('click', () => {
    lightbox.style.display = 'flex';
    showImage(i);
  });
});

lightbox.addEventListener('click', () => {
  lightbox.style.display = 'none';
});

let startX = 0;

lightbox.addEventListener('touchstart', e => {
  startX = e.touches[0].clientX;
});

lightbox.addEventListener('touchend', e => {
  let endX = e.changedTouches[0].clientX;
  if(endX - startX > 50){
    currentIndex = (currentIndex - 1 + imgList.length) % imgList.length;
    showImage(currentIndex);
  } else if(startX - endX > 50){
    currentIndex = (currentIndex + 1) % imgList.length;
    showImage(currentIndex);
  }
});
</script>
