
<!DOCTYPE html>
<html>
<head>
<title>Gallery | Claudia Silva Interiors</title>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@200;300;400&display=swap" rel="stylesheet">

<style>
:root{
  --bg:#f7f3ee;
  --text:#2e2925;
  --muted:#7a7068;
  --burgundy:#6b1f2b;
}

*{box-sizing:border-box}

html{
  opacity:0;
  transition:opacity .8s ease;
  scroll-behavior:smooth;
}

html.page-ready{opacity:1}

body{
  margin:0;
  min-height:100vh;
  display:flex;
  flex-direction:column;
  font-family:'Playfair Display', serif;
  background:var(--bg);
  color:var(--text);
}

main{flex:1}

nav{
  position:absolute;
  top:0;
  left:0;
  right:0;
  display:flex;
  justify-content:center;
  gap:16px;
  padding:26px 18px;
  z-index:20;
  flex-wrap:wrap;
}

nav a{
  text-decoration:none;
  font-size:11px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:white;
  transition:color .3s ease;
}

nav a:hover{
  color:var(--burgundy);
}

.nav-light a{ color:var(--muted); }

.hero{
  min-height:100vh;
  background:linear-gradient(rgba(0,0,0,.18), rgba(0,0,0,.22)), url('hero.jpeg') center/cover no-repeat;
  display:flex;
  align-items:center;
  justify-content:center;
  text-align:center;
  color:white;
  padding:40px 20px;
}

.hero .line1{
  display:block;
  font-weight:200;
  font-size:clamp(2.2rem,4.8vw,3.9rem);
  letter-spacing:.12em;
}

.hero .line2{
  display:block;
  font-weight:200;
  font-size:clamp(1.15rem,2.4vw,1.85rem);
  letter-spacing:.24em;
  margin-top:10px;
}

.header{
  padding:98px 20px 18px;
  text-align:center;
}

.header span{
  color:var(--burgundy);
  font-weight:300;
  font-size:clamp(1.35rem,3vw,1.8rem);
  letter-spacing:.18em;
}

.section{
  max-width:1100px;
  margin:auto;
  padding:46px 30px;
}

.about-wrap,.services-wrap,.contact-wrap{
  max-width:760px;
  margin:auto;
  text-align:center;
}

.about-copy p,.services-wrap p{
  line-height:2.1;
  margin-bottom:18px;
  letter-spacing:.05em;
}

.project-title{
  text-align:center;
  margin:0 0 16px;
  letter-spacing:.18em;
  text-transform:uppercase;
  color:var(--muted);
  font-size:12px;
}

.scroll-gallery{
  display:flex;
  overflow-x:auto;
  gap:18px;
  scroll-snap-type:x mandatory;
  padding-bottom:12px;
}

.scroll-img{
  height:420px;
  width:auto;
  flex-shrink:0;
  scroll-snap-align:start;
  border:none;
}

footer{
  text-align:center;
  padding:40px 20px 50px;
}

footer img{
  width:130px;
  max-width:55%;
  height:auto;
}
</style>
</head>

<body>

<nav>
  <a href="index.html">Home</a>
  <a href="about.html">About</a>
  <a href="gallery.html">Gallery</a>
  <a href="services.html">Services</a>
  <a href="contact.html">Contact</a>
</nav>


<main>
<div class="header"><span>Gallery</span></div>

<section class="section">

<div class="project-title">Project in the Cotswolds</div>
<div class="scroll-gallery">
<img src="hero.jpeg" class="scroll-img">
</div>

</section>
</main>


<footer>
<img src="cs-logo.png" alt="CS Interiors logo">
</footer>


<script>
document.addEventListener('DOMContentLoaded', function () {
  document.documentElement.classList.add('page-ready');

  document.querySelectorAll('a[href$=".html"]').forEach(function(link) {
    link.addEventListener('click', function(e) {
      const href = this.getAttribute('href');
      if (!href) return;
      e.preventDefault();
      document.documentElement.classList.remove('page-ready');
      setTimeout(function () {
        window.location.href = href;
      }, 420);
    });
  });
});
</script>

</body>
</html>
